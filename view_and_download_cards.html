<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhagwa Independence Day Flex Card</title>
    <style>
        body {
            background: #0d0d0d;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        h1 {
            color: #FFD700;
            margin-bottom: 8px;
        }
        p {
            color: #aaa;
            margin-bottom: 30px;
        }
        .cards-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            max-width: 1200px;
        }
        .card-wrapper {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            max-width: 460px;
        }
        .card-wrapper h2 {
            color: #FFD700;
            font-size: 18px;
            margin-top: 0;
        }
        img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            display: block;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .trans-bg img {
            background: repeating-conic-gradient(#222 0% 25%, #151515 0% 50%) 50% / 20px 20px;
        }
        .btn {
            display: inline-block;
            background: #FFD700;
            color: #000;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background: #ffea75;
        }
    </style>
</head>
